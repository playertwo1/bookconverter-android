org.gradle.jvmargs=-Xmx3g -Dfile.encoding=UTF-8
android.useAndroidX=true
kotlin.code.style=official
# KSP 2.2.10-2.0.2 still registers Room's generated sources via kotlin.sourceSets, which AGP 9 built-in Kotlin forbids by default.
android.disallowKotlinSourceSets=false

# Keep the app (and its library) installed after connectedAndroidTest instead of uninstalling it.
android.injected.androidTest.leaveApksInstalledAfterRun=true
